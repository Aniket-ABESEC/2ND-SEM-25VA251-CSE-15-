<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Interest Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        input, button {
            padding: 10px;
            margin: 8px;
            font-size: 16px;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>
<body>

    <h2>Simple Interest Calculator</h2>

    <input type="number" id="principal" placeholder="Enter Principal Amount"><br>

    <input type="number" id="rate" placeholder="Enter Rate (%)"><br>

    <input type="number" id="time" placeholder="Enter Time (Years)"><br>

    <button onclick="calculateSI()">Calculate Interest</button>

    <div id="result"></div>

    <script>
        function calculateSI() {
            let principal = parseFloat(document.getElementById("principal").value);
            let rate = parseFloat(document.getElementById("rate").value);
            let time = parseFloat(document.getElementById("time").value);

            if (isNaN(principal) || isNaN(rate) || isNaN(time)) {
                document.getElementById("result").innerHTML =
                    "Please enter valid values in all fields.";
                return;
            }

            let simpleInterest = (principal * rate * time) / 100;
            let totalAmount = principal + simpleInterest;

            document.getElementById("result").innerHTML =
                `Simple Interest = ₹${simpleInterest.toFixed(2)}<br>
                 Total Amount = ₹${totalAmount.toFixed(2)}`;
        }
    </script>

</body>
</html>
